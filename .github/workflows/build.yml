name: Build & Release

on:
  push:
    branches: [26.2]
  pull_request:
    branches: [26.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        run: ./gradlew fabric:build

      - name: Build NeoForge
        run: ./gradlew neoforge:build

      - name: Remove non-shadow JARs
        run: |
          rm -f fabric/build/libs/*-raw.jar fabric/build/libs/*-sources.jar fabric/build/libs/*-dev.jar fabric/build/libs/*-javadoc.jar fabric/build/libs/*-shadow.jar
          rm -f neoforge/build/libs/*-raw.jar neoforge/build/libs/*-sources.jar neoforge/build/libs/*-dev.jar neoforge/build/libs/*-javadoc.jar neoforge/build/libs/*-shadow.jar

      - name: Get mod version
        id: version
        if: github.event_name == 'push'
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=fabric-v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: AutoTools ${{ steps.version.outputs.MC_VERSION }} v${{ steps.version.outputs.MOD_VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
